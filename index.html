
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilgi Yarışması</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
            color: #333;
        }
        .container {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
        }
        .question-container {
            margin-bottom: 20px;
        }
        .question {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .option {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .option:hover {
            background-color: #2980b9;
        }
        .timer {
            text-align: center;
            font-size: 24px;
            margin: 20px 0;
            color: #e74c3c;
        }
        .progress {
            margin-bottom: 20px;
            font-weight: bold;
        }
        .result {
            text-align: center;
            font-size: 24px;
            margin-top: 20px;
            padding: 20px;
            border-radius: 5px;
            display: none;
        }
        .score {
            font-size: 28px;
            font-weight: bold;
            margin: 10px 0;
        }
        .start-btn, .next-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            display: block;
            margin: 0 auto;
            transition: background-color 0.3s;
        }
        .start-btn:hover, .next-btn:hover {
            background-color: #27ae60;
        }
        .next-btn {
            display: none;
        }
        .correct {
            background-color: #2ecc71 !important;
        }
        .wrong {
            background-color: #e74c3c !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bilgi Yarışması</h1>
        
        <div id="start-screen">
            <p>Toplam 20 soru sorulacaktır.</p>
            <p>Her soru için 15 saniyeniz bulunmaktadır.</p>
            <p>Başarılar!</p>
            <button class="start-btn" onclick="startQuiz()">Başla</button>
        </div>
        
        <div id="quiz-screen" style="display: none;">
            <div class="progress">
                Soru <span id="question-number">1</span>/20 - Puan: <span id="score">0</span>
            </div>
            <div class="timer" id="timer">15</div>
            <div class="question-container">
                <div class="question" id="question"></div>
                <div class="options" id="options"></div>
            </div>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">Sonraki Soru</button>
        </div>
        
        <div id="result-screen" class="result" style="display: none;">
            <h2>Yarışma Bitti!</h2>
            <div class="score">Puanınız: <span id="final-score">0</span>/100</div>
            <p id="result-message"></p>
            <button class="start-btn" onclick="resetQuiz()">Tekrar Oyna</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "Türkiye'nin başkenti neresidir?",
                options: ["A) İstanbul", "B) Ankara", "C) İzmir", "D) Bursa"],
                answer: "B"
            },
            {
                question: "Atatürk'ün doğduğu şehir hangisidir?",
                options: ["A) Selanik", "B) İstanbul", "C) Ankara", "D) Sofya"],
                answer: "A"
            },
            {
                question: "Hangi gezegen Güneş Sistemi'ndeki en büyük gezegendir?",
                options: ["A) Dünya", "B) Mars", "C) Jüpiter", "D) Satürn"],
                answer: "C"
            },
            {
                question: "Türkiye'nin en uzun nehri hangisidir?",
                options: ["A) Kızılırmak", "B) Fırat", "C) Sakarya", "D) Dicle"],
                answer: "A"
            },
            {
                question: "Hangi elementin kimyasal sembolü 'Au'dur?",
                options: ["A) Gümüş", "B) Altın", "C) Alüminyum", "D) Argon"],
                answer: "B"
            },
            {
                question: "İstanbul'un fethi hangi yılda gerçekleşmiştir?",
                options: ["A) 1453", "B) 1492", "C) 1520", "D) 1389"],
                answer: "A"
            },
            {
                question: "Hangi ülkenin bayrağında akçaağaç yaprağı bulunur?",
                options: ["A) ABD", "B) Kanada", "C) İsviçre", "D) Japonya"],
                answer: "B"
            },
            {
                question: "Mona Lisa tablosu kime aittir?",
                options: ["A) Picasso", "B) Van Gogh", "C) Leonardo da Vinci", "D) Michelangelo"],
                answer: "C"
            },
            {
                question: "Türkiye'nin en büyük gölü hangisidir?",
                options: ["A) Tuz Gölü", "B) Van Gölü", "C) Eğirdir Gölü", "D) Beyşehir Gölü"],
                answer: "B"
            },
            {
                question: "Hangi dil dünyada en çok konuşulan dildir?",
                options: ["A) İngilizce", "B) İspanyolca", "C) Çince", "D) Hintçe"],
                answer: "C"
            },
            {
                question: "Hangi gezegene 'Kızıl Gezegen' denir?",
                options: ["A) Venüs", "B) Mars", "C) Jüpiter", "D) Merkür"],
                answer: "B"
            },
            {
                question: "Türkiye'nin en yüksek dağı hangisidir?",
                options: ["A) Erciyes", "B) Uludağ", "C) Ağrı Dağı", "D) Kaçkar Dağı"],
                answer: "C"
            },
            {
                question: "Hangi organ kanı temizler?",
                options: ["A) Kalp", "B) Akciğer", "C) Karaciğer", "D) Böbrek"],
                answer: "D"
            },
            {
                question: "Hangi yıl Türkiye Cumhuriyeti kurulmuştur?",
                options: ["A) 1919", "B) 1920", "C) 1923", "D) 1938"],
                answer: "C"
            },
            {
                question: "Hangi gezegenin halkaları vardır?",
                options: ["A) Mars", "B) Venüs", "C) Satürn", "D) Neptün"],
                answer: "C"
            },
            {
                question: "Hangi şehir 'Efes Antik Kenti'ne ev sahipliği yapar?",
                options: ["A) İzmir", "B) Aydın", "C) Muğla", "D) Denizli"],
                answer: "A"
            },
            {
                question: "Hangi element periyodik tabloda 'Fe' sembolü ile gösterilir?",
                options: ["A) Flor", "B) Fosfor", "C) Demir", "D) Karbon"],
                answer: "C"
            },
            {
                question: "Hangi ülkenin başkenti Tokyo'dur?",
                options: ["A) Çin", "B) Güney Kore", "C) Japonya", "D) Tayland"],
                answer: "C"
            },
            {
                question: "Hangi yazar 'Küçük Prens' kitabını yazmıştır?",
                options: ["A) Victor Hugo", "B) Antoine de Saint-Exupéry", "C) Tolstoy", "D) Dostoyevski"],
                answer: "B"
            },
            {
                question: "Hangi gezegen Güneş'e en yakın gezegendir?",
                options: ["A) Venüs", "B) Mars", "C) Merkür", "D) Dünya"],
                answer: "C"
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let timer;
        let timeLeft = 15;
        let shuffledQuestions = [];

        function startQuiz() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'block';
            
            // Soruları karıştır
            shuffledQuestions = [...questions].sort(() => Math.random() - 0.5);
            
            showQuestion();
            startTimer();
        }

        function showQuestion() {
            if (currentQuestion >= 20) {
                showResult();
                return;
            }

            const question = shuffledQuestions[currentQuestion];
            document.getElementById('question').textContent = question.question;
            document.getElementById('question-number').textContent = currentQuestion + 1;
            document.getElementById('score').textContent = score;

            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';

            question.options.forEach(option => {
                const button = document.createElement('button');
                button.className = 'option';
                button.textContent = option;
                button.onclick = () => selectAnswer(option[0]);
                optionsContainer.appendChild(button);
            });

            document.getElementById('next-btn').style.display = 'none';
        }

        function selectAnswer(selectedOption) {
            clearInterval(timer);
            
            const question = shuffledQuestions[currentQuestion];
            const options = document.querySelectorAll('.option');
            
            options.forEach(option => {
                option.disabled = true;
                if (option.textContent[0] === question.answer) {
                    option.classList.add('correct');
                } else if (option.textContent[0] === selectedOption && selectedOption !== question.answer) {
                    option.classList.add('wrong');
                }
            });

            if (selectedOption === question.answer) {
                score += 5;
                document.getElementById('score').textContent = score;
            }

            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentQuestion++;
            timeLeft = 15;
            document.getElementById('timer').textContent = timeLeft;
            
            if (currentQuestion < 20) {
                showQuestion();
                startTimer();
            } else {
                showResult();
            }
        }

        function startTimer() {
            clearInterval(timer);
            timeLeft = 15;
            document.getElementById('timer').textContent = timeLeft;
            
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').textContent = timeLeft;
                
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    document.getElementById('timer').textContent = "Zaman doldu!";
                    
                    const options = document.querySelectorAll('.option');
                    options.forEach(option => {
                        option.disabled = true;
                    });
                    
                    document.getElementById('next-btn').style.display = 'block';
                }
            }, 1000);
        }

        function showResult() {
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            
            document.getElementById('final-score').textContent = score;
            
            let message = "";
            if (score >= 80) {
                message = "Mükemmel! Çok iyi bir performans gösterdiniz.";
            } else if (score >= 60) {
                message = "İyi iş! Gayet başarılısınız.";
            } else if (score >= 40) {
                message = "Fena değil, daha fazla çalışmalısınız.";
            } else {
                message = "Daha çok çalışmanız gerekiyor.";
            }
            
            document.getElementById('result-message').textContent = message;
        }

        function resetQuiz() {
            currentQuestion = 0;
            score = 0;
            timeLeft = 15;
            
            document.getElementById('result-screen').style.display = 'none';
            document.getElementById('start-screen').style.display = 'block';
        }
    </script>
</body>
</html>
